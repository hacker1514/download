name: Build K Drive

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    strategy:
      matrix:

        include:

          - os: windows-latest
            file: k-windows.py
            output: k-windows.exe

          - os: ubuntu-latest
            file: k-linux.py
            output: k-linux.bin

          - os: macos-latest
            file: k-mac.py
            output: k-mac.bin


    runs-on: ${{ matrix.os }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller


      - name: Build executable
        run: |
          pyinstaller --onefile ${{ matrix.file }}


      - name: Rename output
        shell: bash
        run: |

          if [[ "${{ runner.os }}" == "Windows" ]]; then
              mv dist/k-windows.exe ${{ matrix.output }}

          else
              mv dist/k-* ${{ matrix.output }}

          fi


      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

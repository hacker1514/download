name: Build K Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile k.py

      - name: Rename executable
        shell: bash
        run: |
          mkdir output

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv dist/k.exe output/k-windows.exe
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            mv dist/k output/k-linux
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            mv dist/k output/k-macos
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: k-${{ runner.os }}
          path: output/
